<ul class="social-media-list" style="display: inline-flex; align-items: center; list-style: none; padding: 0; margin: 0; gap: 15px;">
  
  {%- if site.github_username -%}
    <li style="margin: 0; display: inline-flex; align-items: center;">
      <a href="https://github.com{{ site.github_username }}" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center;">
        <svg class="svg-icon" style="width: 20px; height: 20px; fill: currentColor; display: block;"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg>
        <span class="username">{{ site.github_username }}</span>
      </a>
    </li>
  {%- endif -%}

  {%- if site.twitter_username -%}
    <li style="margin: 0; display: inline-flex; align-items: center;">
      <a href="https://twitter.com{{ site.twitter_username }}" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center;">
        <svg class="svg-icon" style="width: 20px; height: 20px; fill: currentColor; display: block;"><use xlink:href="{{ '/assets/minima-social-icons.svg#twitter' | relative_url }}"></use></svg>
        <span class="username">{{ site.twitter_username }}</span>
      </a>
    </li>
  {%- endif -%}

  {%- if site.linkedin_username -%}
    <li style="margin: 0; display: inline-flex; align-items: center;">
      <a href="https://linkedin.com{{ site.linkedin_username }}" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center;">
        <svg class="svg-icon" style="width: 20px; height: 20px; fill: currentColor; display: block;"><use xlink:href="{{ '/assets/minima-social-icons.svg#linkedin' | relative_url }}"></use></svg>
        <span class="username">{{ site.linkedin_username }}</span>
      </a>
    </li>
  {%- endif -%}

</ul>
